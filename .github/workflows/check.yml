name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # Private flake inputs are fetched over SSH with read-only deploy keys; a deploy key
      # authorises one repository, so each repository gets a host alias offering only its key.
      - name: Configure deploy keys
        env:
          BAY_DEPLOY_KEY: ${{ secrets.BAY_DEPLOY_KEY }}
          PITUITARY_DEPLOY_KEY: ${{ secrets.PITUITARY_DEPLOY_KEY }}
        run: |
          # creates the SSH directory, private to the runner user
          install -d -m 700 ~/.ssh
          # routes fetches of gshpychka/<repo> through a host alias that authenticates with the given key
          deploy_key() {
            # writes the private key as ~/.ssh/<repo>, readable only by the runner user
            (umask 077 && printf '%s\n' "$2" > ~/.ssh/"$1")
            # declares <repo>.github.com as github.com, authenticating with that key alone
            printf 'Host %s.github.com\n  HostName github.com\n  IdentityFile ~/.ssh/%s\n  IdentitiesOnly yes\n' "$1" "$1" >> ~/.ssh/config
            # rewrites the flake input's URL onto the alias for every git invocation
            git config --global url."ssh://git@$1.github.com/gshpychka/$1".insteadOf "ssh://git@github.com/gshpychka/$1"
          }
          # routes the bay input through its deploy key
          deploy_key bay "$BAY_DEPLOY_KEY"
          # routes the pituitary input through its deploy key
          deploy_key pituitary "$PITUITARY_DEPLOY_KEY"
      # Fleet-wide eval: all systems, no machine builds.
      - run: nix flake check --all-systems --no-build
      # --no-build skips the check derivations, so build the lint/format checks to run them.
      - run: nix build --no-link -L .#checks.x86_64-linux.statix .#checks.x86_64-linux.deadnix .#checks.x86_64-linux.treefmt
