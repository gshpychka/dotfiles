[build-system]
requires = ["setuptools", "pybind11"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-broker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp", "numpy", "openai", "soxr", "websockets"]

[project.scripts]
voice-broker = "voice_broker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
