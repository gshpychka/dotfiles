# Firmware for every Voice PE in the house: the stock firmware plus OpenAI Live
# through the voice broker on hoard.
#
# Everything stock comes from the upstream release below; this file only adds
# the voice_broker component and per-wake-word routing. Deployment: runbook.md.

substitutions:
  # packages/voice-broker on hoard; the port is my.voice-broker.port
  voice_broker_url: ws://hoard.glib.sh:10310

packages:
  voice_pe:
    url: https://github.com/esphome/home-assistant-voice-pe
    ref: 26.9.0
    files: [home-assistant-voice.yaml]

# Wi-Fi credentials were provisioned into flash by the factory firmware's
# Improv and are reused from there; Improv over USB can replace them.
improv_serial:

# Keys are restored/provisioned from device NVS, never compiled in.
api:
  encryption: {}
  custom_services: true

# API protobuf dumps at VERY_VERBOSE can contain action arguments.
logger:
  level: INFO

external_components:
  - source:
      type: local
      path: components
    components: [voice_broker]

# ESPHome enables only the first model by default and restores enabled state.
# Append to the upstream client-connected list; do not override its boot script.
voice_assistant:
  on_client_connected:
    - micro_wake_word.enable_model: okay_nabu
    - micro_wake_word.enable_model: hey_jarvis

voice_broker:
  id: broker
  url: ${voice_broker_url}
  microphone:
    microphone: i2s_mics
    # XMOS channel 0 carries its echo-cancelled output; the broker's AEC
    # removes what that leaves.
    channels: 0
  # The announcement path, so music on the media path keeps playing, ducked.
  speaker: announcement_resampling_speaker
  on_phase:
    - lambda: |-
        if (phase == "listening") {
          id(voice_assistant_phase) = ${voice_assist_listening_for_command_phase_id};
        } else if (phase == "thinking") {
          id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
        } else if (phase == "replying") {
          id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
        }
    - script.execute: control_leds
  # Only before any mic audio has been sent to Live. Never replay commands.
  on_startup_failure:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s
    - voice_assistant.start:
        wake_word: !lambda return wake_word;
  on_error:
    - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
    - script.execute: control_leds
  on_end:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s
    - if:
        condition:
          lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
        then:
          - delay: 1s
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds

binary_sensor:
  - id: !extend center_button
    # A press during a broker conversation ends it and does nothing else.
    # color_changed is upstream's flag for a press consumed by another gesture;
    # every click handler skips while it is set.
    on_press:
      - if:
          condition:
            voice_broker.is_running:
          then:
            - lambda: id(color_changed) = true;
            - voice_broker.stop:
            - wait_until:
                binary_sensor.is_off: center_button
            # Past the multi-click window, as upstream's dial handler does.
            - delay: 500ms
            - lambda: id(color_changed) = false;

micro_wake_word:
  # Upstream's handler, with a broker branch: the wake word also ends a
  # running broker conversation, the way it stops a running Assist pipeline.
  # A mapping replaces upstream's action list, which a list here would
  # extend (packages concatenate lists).
  on_wake_word_detected:
    then:
      - if:
          condition:
            switch.is_off: master_mute_switch
          then:
            - if:
                condition:
                  switch.is_on: timer_ringing
                then:
                  - switch.turn_off: timer_ringing
                else:
                  - if:
                      condition:
                        voice_broker.is_running:
                      then:
                        - voice_broker.stop:
                      else:
                        - if:
                            condition:
                              voice_assistant.is_running:
                            then:
                              voice_assistant.stop:
                            else:
                              - if:
                                  condition:
                                    media_player.is_announcing:
                                      id: external_media_player
                                  then:
                                    - media_player.stop:
                                        announcement: true
                                        id: external_media_player
                                  else:
                                    - if:
                                        condition:
                                          switch.is_on: wake_sound
                                        then:
                                          - script.execute:
                                              id: play_sound
                                              priority: true
                                              sound_file: "wake_word_triggered_sound"
                                          - delay: 300ms
                                    - if:
                                        condition:
                                          lambda: return wake_word == "Hey Jarvis";
                                        then:
                                          - mixer_speaker.apply_ducking:
                                              id: media_mixing_input
                                              decibel_reduction: 20
                                              duration: 0.0s
                                          - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
                                          - script.execute: control_leds
                                          - voice_broker.start:
                                              wake_word: !lambda return wake_word;
                                        else:
                                          - voice_assistant.start:
                                              wake_word: !lambda return wake_word;
