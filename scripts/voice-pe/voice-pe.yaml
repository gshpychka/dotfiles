# Firmware for every Voice PE in the house: the stock firmware plus switchable
# OpenAI backends.
#
# Everything stock comes from the upstream release below; this file only adds
# the realtime_voice component, the "Voice backend" select and the wake word
# routing between them. Deployment: runbook.md.

substitutions:
  # packages/realtime-voice on hoard; the port is my.realtime-voice.port
  realtime_voice_url: ws://hoard.glib.sh:10310

packages:
  voice_pe:
    url: https://github.com/esphome/home-assistant-voice-pe
    ref: 26.9.0
    files: [home-assistant-voice.yaml]

# Wi-Fi credentials were provisioned into flash by the factory firmware's
# Improv and are reused from there; Improv over USB can replace them.
improv_serial:

external_components:
  - source:
      type: local
      path: components
    components: [realtime_voice]

select:
  - platform: template
    id: voice_backend
    name: Voice backend
    icon: mdi:account-voice
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - Home Assistant
      - Realtime
      - Live
    initial_option: Home Assistant

realtime_voice:
  id: rtv
  url: ${realtime_voice_url}
  token: !secret realtime_voice_token
  microphone:
    microphone: i2s_mics
    # XMOS channel 0 carries its echo-cancelled output; the broker's AEC
    # removes what that leaves.
    channels: 0
  # The announcement path, so music on the media path keeps playing, ducked.
  speaker: announcement_resampling_speaker
  on_phase:
    - lambda: |-
        if (phase == "listening") {
          id(voice_assistant_phase) = ${voice_assist_listening_for_command_phase_id};
        } else if (phase == "thinking") {
          id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
        } else if (phase == "replying") {
          id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
        }
    - script.execute: control_leds
  on_error:
    - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
    - script.execute: control_leds
  on_end:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s
    - if:
        condition:
          lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
        then:
          - delay: 1s
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds

binary_sensor:
  - id: !extend center_button
    # A press during a broker conversation ends it and does nothing else.
    # color_changed is upstream's flag for a press consumed by another gesture;
    # every click handler skips while it is set.
    on_press:
      - if:
          condition:
            realtime_voice.is_running:
          then:
            - lambda: id(color_changed) = true;
            - realtime_voice.stop:
            - wait_until:
                binary_sensor.is_off: center_button
            # Past the multi-click window, as upstream's dial handler does.
            - delay: 500ms
            - lambda: id(color_changed) = false;

micro_wake_word:
  # Upstream's handler, with a Realtime branch: the wake word also ends a
  # running Realtime conversation, the way it stops a running Assist pipeline.
  # A mapping replaces upstream's action list, which a list here would
  # extend (packages concatenate lists).
  on_wake_word_detected:
    then:
      - if:
          condition:
            switch.is_off: master_mute_switch
          then:
            - if:
                condition:
                  switch.is_on: timer_ringing
                then:
                  - switch.turn_off: timer_ringing
                else:
                  - if:
                      condition:
                        realtime_voice.is_running:
                      then:
                        - realtime_voice.stop:
                      else:
                        - if:
                            condition:
                              voice_assistant.is_running:
                            then:
                              voice_assistant.stop:
                            else:
                              - if:
                                  condition:
                                    media_player.is_announcing:
                                      id: external_media_player
                                  then:
                                    - media_player.stop:
                                        announcement: true
                                        id: external_media_player
                                  else:
                                    - if:
                                        condition:
                                          switch.is_on: wake_sound
                                        then:
                                          - script.execute:
                                              id: play_sound
                                              priority: true
                                              sound_file: "wake_word_triggered_sound"
                                          - delay: 300ms
                                    - if:
                                        condition:
                                          select.is:
                                            id: voice_backend
                                            options: [Realtime, Live]
                                        then:
                                          - mixer_speaker.apply_ducking:
                                              id: media_mixing_input
                                              decibel_reduction: 20
                                              duration: 0.0s
                                          - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
                                          - script.execute: control_leds
                                          - if:
                                              condition:
                                                select.is:
                                                  id: voice_backend
                                                  options: [Live]
                                              then:
                                                - realtime_voice.start:
                                                    wake_word: !lambda return wake_word;
                                                    backend: live
                                              else:
                                                - realtime_voice.start:
                                                    wake_word: !lambda return wake_word;
                                                    backend: realtime
                                        else:
                                          - voice_assistant.start:
                                              wake_word: !lambda return wake_word;
